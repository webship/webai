include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - "/includes/include.drupalci.main.yml"
      - "/includes/include.drupalci.variables.yml"
      - "/includes/include.drupalci.workflows.yml"

variables:
  OPT_IN_TEST_NEXT_MAJOR: 1
  OPT_IN_TEST_MAX_PHP: 1
  COMPOSER_FLAGS: "--no-strict-lock"
  COMPOSER_MEMORY_LIMIT: "-1"

# Override the default composer job to use development versions.
composer:
  variables:
    DRUPAL_CORE: $CORE_SUPPORTED
    IGNORE_PROJECT_DRUPAL_CORE_VERSION: 0

cspell:
  stage: validate
  image: node:20
  before_script:
    - npm install -g cspell
  script:
    - cspell "**/*.{php,module,inc,install,test,profile,theme,js,css,md,yml,txt}" --no-progress || true
  allow_failure: true

# Drupal 12: let Composer install the contributed modules that do not declare
# ^12 yet.
composer (next major):
  variables:
    _LENIENT_ALLOW_LIST: "ai,ai_agents,ai_assistant_api,ai_chatbot,ai_content_suggestions,ai_image_alt_text,ai_logging,ai_penpot,ai_playwright,ai_provider_anthropic,ai_provider_huggingface,ai_provider_ollama,ai_provider_openai,ai_provider_xai,ai_translate,antibot,autocomplete_deluxe,automatic_updates,better_exposed_filters,captcha,coffee,config_filter,config_ignore,config_import_single,config_rewrite,config_split,config_update,config_update_ui,consumers,crop,ctools,dashboards,display_builder,display_builder_entity_view,display_builder_page_layout,display_builder_ui,display_builder_views,drupical,easy_breadcrumb,easy_encryption,editor_advanced_link,embed,entity_embed,field_group,field_validation,flood_control,focal_point,friendlycaptcha,gemini_provider,google_analytics,google_tag,honeypot,inline_entity_form,jsonapi_extras,key,klaro,login_emailusername,manage_display,media_directories_editor,media_directories_ui,media_remote_audio,media_remote_image,metatag,openapi,openapi_jsonapi,openapi_rest,openapi_ui,openapi_ui_swagger,pathauto,recaptcha_v3,redirect,restui,sam,schema_metatag,schemata,schemata_json_schema,seckit,security_review,shield,simple_oauth,smart_trim,tagify,token,token_filter,tracker,user_redirect,view_password,views_bulk_edit,views_bulk_operations,webform,xmlsitemap,yoast_seo"
